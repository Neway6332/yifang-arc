# Decap CMS Configuration
# https://decapcms.org/docs/configuration-options/

backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "projects"
    label: "项目案例"
    format: "json"
    create: true
    delete: true
    editor:
      preview: false
    files:
      - label: "项目列表"
        name: "projects"
        file: "data/projects.json"
        fields:
          - label: "项目"
            name: "list"
            widget: "list"
            fields:
              - {label: "编号", name: "number", widget: "string", hint: "如 01, 02"}
              - {label: "项目名称", name: "title", widget: "string"}
              - {label: "类别", name: "type", widget: "select", options: ["文化建筑", "办公 / 产业园", "住宅建筑", "城市更新", "商业空间", "公共设施"]}
              - {label: "描述", name: "desc", widget: "text"}
              - {label: "图片", name: "image", widget: "image", required: false, hint: "上传项目图片，建议 1200x800px"}
              - {label: "排序", name: "order", widget: "number", default: 0}

  - name: "company"
    label: "公司信息"
    format: "json"
    files:
      - label: "基本信息"
        name: "info"
        file: "data/company.json"
        fields:
          - {label: "公司简介标题", name: "intro_title", widget: "string", default: "关于异方"}
          - {label: "公司简介", name: "intro", widget: "text"}
          - {label: "简介副文本", name: "intro_detail", widget: "text", required: false}
          - {label: "从业年数", name: "years", widget: "number", value_type: "int"}
          - {label: "项目总数", name: "projects_count", widget: "number", value_type: "int"}
          - {label: "奖项总数", name: "awards_count", widget: "number", value_type: "int"}
          - {label: "地址", name: "address", widget: "string"}
          - {label: "电话", name: "phone", widget: "string"}
          - {label: "邮箱", name: "email", widget: "string"}
