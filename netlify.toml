[build]
  publish = "."

# Redirect HTTP to HTTPS
[[redirects]]
  from = "http://yifang-arc.com/*"
  to = "https://yifang-arc.com/:splat"
  status = 301

[[redirects]]
  from = "http://www.yifang-arc.com/*"
  to = "https://www.yifang-arc.com/:splat"
  status = 301

# Decap CMS admin
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301